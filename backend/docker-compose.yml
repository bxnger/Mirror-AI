name: mirror-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mirror_ai
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mirror:mirror@db:5432/mirror_ai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MIRROR_LLM: ${MIRROR_LLM:-auto}
      MIRROR_LLM_MODEL: ${MIRROR_LLM_MODEL:-claude-opus-5-5}
    ports:
      - "${MIRROR_PORT:-8000}:8000"

volumes:
  pgdata:
