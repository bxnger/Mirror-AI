name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  tests:
    name: tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mirror_ai
          POSTGRES_USER: mirror
          POSTGRES_PASSWORD: mirror
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mirror -d mirror_ai"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://mirror:mirror@localhost:5432/mirror_ai' || '' }}
        run: python -m pytest -q
      - name: Demo end-to-end
        env:
          DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://mirror:mirror@localhost:5432/mirror_ai' || 'sqlite://' }}
          MIRROR_LLM: "off"
        run: python -m scripts.run_demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mirror-ai-backend backend
